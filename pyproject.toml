[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campora-ai-scraper"
version = "0.1.0"
description = "Telegram message scraper and data pipeline for Campora AI"
dependencies = [
    "python-dotenv",
    "openai",
    "groq",
    "supabase",
    "telethon",
]

[project.optional-dependencies]
dev = ["black", "flake8", "isort", "pre-commit"]

[tool.black]
line-length = 200

[tool.isort]
profile = "black"
